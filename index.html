<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Intelligence Council</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 antialiased selection:bg-slate-800 selection:text-white">

    <main class="w-full max-w-lg mx-auto text-center">
        <!-- Main Card Container -->
        <div class="bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-2xl p-8 sm:p-12 shadow-2xl">
            
            <!-- Title -->
            <h1 class="text-3xl sm:text-4xl font-light tracking-tight text-white mb-6">
                Super Intelligence Council
            </h1>

            <!-- Displayed Email Address -->
            <div class="mb-8">
                <a href="mailto:SIC@nahigianstrategies.com?subject=Super%20Intelligence%20Council%20Inquiry" 
                   class="inline-block text-cyan-400 hover:text-cyan-300 font-mono text-base sm:text-lg underline underline-offset-4 transition-colors">
                    SIC@nahigianstrategies.com
                </a>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <!-- Primary Email CTA -->
                <a href="mailto:SIC@nahigianstrategies.com?subject=Super%20Intelligence%20Council%20Inquiry" 
                   class="w-full sm:w-auto inline-flex items-center justify-center gap-2.5 px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-medium text-sm transition-all duration-200 shadow-lg shadow-cyan-500/10">
                    <i class="fa-regular fa-envelope"></i>
                    <span>Get in Touch</span>
                </a>

                <!-- Copy Email Button -->
                <button onclick="copyEmail()" id="copyBtn" 
                        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700/60 text-sm font-medium transition-all duration-200">
                    <i class="fa-regular fa-copy text-xs"></i>
                    <span id="copyBtnText">Copy Email</span>
                </button>
            </div>
            
        </div>
    </main>

    <script>
        function copyEmail() {
            const email = "SIC@nahigianstrategies.com";
            
            // Clipboard copy implementation
            const tempInput = document.createElement('input');
            tempInput.value = email;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const btnText = document.getElementById('copyBtnText');
            btnText.textContent = 'Copied!';
            setTimeout(() => {
                btnText.textContent = 'Copy Email';
            }, 2000);
        }
    </script>
</body>
</html>
